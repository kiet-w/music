version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: music_postgres
    environment:
      POSTGRES_USER: music_user
      POSTGRES_PASSWORD: music_password
      POSTGRES_DB: music_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_user -d music_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: music_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: music_backend
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "postgresql://music_user:music_password@postgres:5432/music_db?schema=public"
      DIRECT_URL: "postgresql://music_user:music_password@postgres:5432/music_db"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3003"
      JWT_SECRET: "dev_jwt_secret_change_in_production"
      JWT_EXPIRES_IN: "15m"
      REFRESH_TOKEN_SECRET: "dev_refresh_secret_change_in_production"
      REFRESH_TOKEN_EXPIRES_IN: "7d"
      ENCRYPTION_KEY: "dev_encryption_key_change_in_production"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    command: npm run start:dev

  # Python Converter Service
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: music_python_backend
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      ENVIRONMENT: development
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3003"
      OUTPUT_DIR: /tmp/music_converter_downloads
      USE_REDIS: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./python-backend:/app
      - /tmp/music_converter_downloads:/tmp/music_converter_downloads

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_PYTHON_API_URL: http://localhost:8001
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy_client_id
        NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: music_frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_PYTHON_API_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - python-backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data: