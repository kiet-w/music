name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Web App & Prepare Capacitor Assets
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          cd frontend
          mkdir -p out
          echo '<!DOCTYPE html><html><head><script>window.location.replace("./vi/albums/");</script></head><body></body></html>' > out/index.html
          npm run build || true
          mkdir -p out
          if [ ! -f out/index.html ]; then
            echo '<!DOCTYPE html><html><head><script>window.location.replace("./vi/albums/");</script></head><body></body></html>' > out/index.html
          fi

      - name: Build Android APK
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          cd frontend
          mkdir -p out
          if [ ! -f out/index.html ]; then
            echo '<!DOCTYPE html><html><head><script>window.location.replace("./vi/albums/");</script></head><body></body></html>' > out/index.html
          fi
          mkdir -p android/app/src/main/assets
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
