name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Web App
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          cd frontend
          npm run build || true
          mkdir -p out
          if [ ! -f out/index.html ]; then
            cp out/vi.html out/index.html 2>/dev/null || cp out/en.html out/index.html 2>/dev/null || cp out/vi/index.html out/index.html 2>/dev/null || cp out/en/index.html out/index.html 2>/dev/null || echo '<!DOCTYPE html><html><head><script>window.location.href="/vi/albums";</script></head><body></body></html>' > out/index.html
          fi

      - name: Build Android APK
        run: |
          cd frontend
          mkdir -p out
          mkdir -p android/app/src/main/assets
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
