<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Test automation pyramid</title><desc id="desc">A pyramid shows many unit tests, fewer service tests, and few end-to-end tests.</desc><rect width="1500" height="820" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Automation pyramid: balance speed, confidence, and maintenance</text><path d="M750 145 L1250 675 L250 675 Z" fill="#dbeafe" stroke="#334155" stroke-width="3"/><path d="M420 495H1080L1250 675H250Z" fill="#dcfce7" stroke="#334155" stroke-width="3"/><path d="M585 320H915L1080 495H420Z" fill="#fef3c7" stroke="#334155" stroke-width="3"/><g font-family="Arial" text-anchor="middle" fill="#0f172a"><text x="750" y="285" font-size="26" font-weight="700">Few E2E/UI tests</text><text x="750" y="390" font-size="25" font-weight="700">Service / API tests</text><text x="750" y="455" font-size="19">fast feedback, stable contracts</text><text x="750" y="580" font-size="27" font-weight="700">Many unit tests</text><text x="750" y="620" font-size="19">developer-owned, fast, focused</text></g><text x="750" y="760" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Manual exploratory, usability, and new-feature investigation remain essential outside the pyramid.</text></svg>
