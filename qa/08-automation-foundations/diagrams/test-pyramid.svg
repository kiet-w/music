<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Test Automation Pyramid</title>
  <desc id="desc">Test automation strategy showing recommended proportion of Unit, Integration, and UI tests.</desc>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Test Automation Pyramid Strategy</text>

  <g font-family="Arial, sans-serif" stroke="#334155" stroke-width="2">
    <!-- E2E / UI Tests (Top) -->
    <polygon points="750,140 450,330 1050,330" fill="#fee2e2"/>
    <text x="750" y="240" text-anchor="middle" font-size="24" font-weight="700" stroke="none" fill="#b91c1c">E2E / UI Tests (10%)</text>
    <text x="750" y="275" text-anchor="middle" font-size="18" stroke="none" fill="#475569">Playwright / Cypress — User Flows</text>
    <text x="750" y="305" text-anchor="middle" font-size="16" stroke="none" fill="#b91c1c">Chậm • Dễ Flaky • Đắt để duy trì</text>

    <!-- Integration / API Tests (Middle) -->
    <polygon points="450,330 250,550 1250,550" fill="#dbeafe"/>
    <text x="750" y="420" text-anchor="middle" font-size="26" font-weight="700" stroke="none" fill="#1e3a8a">Integration &amp; API Tests (20%)</text>
    <text x="750" y="460" text-anchor="middle" font-size="18" stroke="none" fill="#475569">REST API, Database &amp; Service Communication</text>
    <text x="750" y="490" text-anchor="middle" font-size="16" stroke="none" fill="#1e3a8a">Nhanh • Rất Ổn Định • Độ Bao Phủ Rộng</text>

    <!-- Unit Tests (Base) -->
    <polygon points="250,550 80,750 1420,750" fill="#dcfce7"/>
    <text x="750" y="630" text-anchor="middle" font-size="28" font-weight="700" stroke="none" fill="#15803d">Unit Tests (70%)</text>
    <text x="750" y="670" text-anchor="middle" font-size="20" stroke="none" fill="#475569">Jest, Vitest, React Testing Library — Pure Functions &amp; Components</text>
    <text x="750" y="705" text-anchor="middle" font-size="18" stroke="none" fill="#15803d">Cực Kỳ Nhanh (Milliseconds) • Rẻ • Chạy Mỗi Commit</text>
  </g>

  <!-- Side Comparisons -->
  <g font-family="Arial, sans-serif" font-size="18" fill="#475569">
    <text x="110" y="240" font-weight="700" fill="#b91c1c">⚠️ Ice Cream Cone (Anti-pattern):</text>
    <text x="110" y="270">• Quá nhiều E2E UI Tests</text>
    <text x="110" y="295">• CI/CD chạy mất 45 phút</text>
    <text x="110" y="320">• Flaky tests liên tục thất bại</text>
  </g>

  <text x="750" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Tập trung viết nhiều Unit &amp; API Tests; chỉ dùng E2E cho các luồng nghiệp vụ quan trọng nhất (Happy path + Critical Flow).</text>
</svg>
