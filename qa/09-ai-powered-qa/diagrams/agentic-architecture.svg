<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">3-Agent Agentic Testing Architecture</title>
  <desc id="desc">Planner, Generator, and Healer AI agents collaborating via Playwright MCP.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">3-Agent Agentic Testing Architecture (Playwright MCP)</text>

  <g font-family="Arial, sans-serif" stroke="#334155" stroke-width="2">
    <!-- PRD Input -->
    <rect x="70" y="330" width="180" height="120" rx="14" fill="#dbeafe"/>
    <text x="160" y="380" text-anchor="middle" font-size="22" font-weight="700" stroke="none" fill="#1e3a8a">PRD / Spec</text>
    <text x="160" y="415" text-anchor="middle" font-size="16" stroke="none" fill="#475569">User Stories</text>

    <!-- PLANNER Agent -->
    <rect x="330" y="270" width="280" height="240" rx="16" fill="#ede9fe"/>
    <text x="470" y="320" text-anchor="middle" font-size="24" font-weight="700" stroke="none" fill="#6d28d9">🧠 PLANNER AGENT</text>
    <text x="360" y="365" font-size="17" stroke="none" fill="#475569">• Phân tích PRD &amp; Spec</text>
    <text x="360" y="400" font-size="17" stroke="none" fill="#475569">• Lập Test Strategy</text>
    <text x="360" y="435" font-size="17" stroke="none" fill="#475569">• Sinh Matrix Scenarios</text>
    <text x="360" y="470" font-size="15" font-weight="700" stroke="none" fill="#6d28d9">LLM: Claude 3.5 / Gemini</text>

    <!-- GENERATOR Agent -->
    <rect x="690" y="270" width="300" height="240" rx="16" fill="#dcfce7"/>
    <text x="840" y="320" text-anchor="middle" font-size="24" font-weight="700" stroke="none" fill="#15803d">⚡ GENERATOR AGENT</text>
    <text x="720" y="365" font-size="17" stroke="none" fill="#475569">• Đọc Accessibility Tree</text>
    <text x="720" y="400" font-size="17" stroke="none" fill="#475569">• Sinh Playwright Code</text>
    <text x="720" y="435" font-size="17" stroke="none" fill="#475569">• Áp dụng chuẩn POM</text>
    <text x="720" y="470" font-size="15" font-weight="700" stroke="none" fill="#15803d">MCP: @playwright/mcp</text>

    <!-- HEALER Agent -->
    <rect x="1070" y="270" width="280" height="240" rx="16" fill="#fef3c7"/>
    <text x="1210" y="320" text-anchor="middle" font-size="24" font-weight="700" stroke="none" fill="#b45309">🔧 HEALER AGENT</text>
    <text x="1100" y="365" font-size="17" stroke="none" fill="#475569">• Giám sát Test Runs</text>
    <text x="1100" y="400" font-size="17" stroke="none" fill="#475569">• Đọc DOM Snapshot mới</text>
    <text x="1100" y="435" font-size="17" stroke="none" fill="#475569">• Sửa selector khi UI đổi</text>
    <text x="1100" y="470" font-size="15" font-weight="700" stroke="none" fill="#b45309">Self-Healing Loop</text>

    <!-- Bottom Feature Summary Banner -->
    <rect x="70" y="620" width="1280" height="130" rx="16" fill="#ffffff"/>
    <text x="710" y="665" text-anchor="middle" font-size="22" font-weight="700" stroke="none" fill="#0f172a">Điểm đột phá so với Automation truyền thống:</text>
    <text x="710" y="705" text-anchor="middle" font-size="18" stroke="none" fill="#475569">1. Dùng Accessibility Tree (Role/Name) thay vì Vision/Screenshot ➔ Chính xác 100%, không flaky.</text>
    <text x="710" y="735" text-anchor="middle" font-size="18" stroke="none" fill="#475569">2. Tự phục hồi kịch bản test (Self-healing) khi UI thay đổi ➔ Tiết kiệm 80% chi phí bảo trì test code.</text>
  </g>

  <!-- Connectors -->
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M250 390H330"/>
    <path d="M610 390H690"/>
    <path d="M990 390H1070"/>
    <!-- Feedback loop from Healer to Generator -->
    <path d="M1210 270C1210 180 840 180 840 270"/>
  </g>
  <text x="1025" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b45309">Auto-Fix Code</text>

  <text x="750" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Mô hình 3 Agent giúp tự động hóa quy trình từ Đọc PRD ➔ Viết Test Code ➔ Tự sửa lỗi khi UI thay đổi.</text>
</svg>
