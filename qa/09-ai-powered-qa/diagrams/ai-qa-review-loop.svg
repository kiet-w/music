<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">AI-powered QA review loop</title><desc id="desc">Requirements lead to a bounded prompt, AI draft, human QA review, application evidence and improved test assets.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="1500" height="820" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">AI-Powered QA: AI drafts, human QA verifies</text><g font-family="Arial" font-size="22" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="65" y="290" width="220" height="105" rx="14" fill="#dbeafe"/><text x="175" y="335" stroke="none">Confirmed context</text><text x="175" y="367" stroke="none">spec + rules</text><rect x="370" y="290" width="220" height="105" rx="14" fill="#fef3c7"/><text x="480" y="335" stroke="none">Bounded prompt</text><text x="480" y="367" stroke="none">no sensitive data</text><rect x="675" y="290" width="220" height="105" rx="14" fill="#e9d5ff"/><text x="785" y="335" stroke="none">AI draft</text><text x="785" y="367" stroke="none">cases / risks / wording</text><rect x="980" y="290" width="220" height="105" rx="14" fill="#fee2e2"/><text x="1090" y="335" stroke="none">QA review</text><text x="1090" y="367" stroke="none">oracle + risk + scope</text><rect x="675" y="575" width="220" height="105" rx="14" fill="#dcfce7"/><text x="785" y="620" stroke="none">Run on app</text><text x="785" y="652" stroke="none">actual + evidence</text></g><g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"><path d="M285 342H370M590 342H675M895 342H980M1090 395C1090 510 900 610 895 620M675 620C340 620 250 510 175 395"/></g><text x="750" y="755" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Evidence and lessons update 