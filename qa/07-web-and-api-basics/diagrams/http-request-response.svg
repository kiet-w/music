<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc"><title id="title">HTTP request response flow</title><desc id="desc">Browser or Postman sends request to API which validates and accesses data then returns response.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="1500" height="780" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">HTTP: client request and API response</text><g font-family="Arial" font-size="23" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="90" y="280" width="260" height="150" rx="14" fill="#dbeafe"/><text x="220" y="335" stroke="none">Client</text><text x="220" y="370" stroke="none">Browser / Postman</text><rect x="600" y="280" width="300" height="150" rx="14" fill="#ede9fe"/><text x="750" y="335" stroke="none">API server</text><text x="750" y="370" stroke="none">validate + business logic</text><rect x="1150" y="280" width="260" height="150" rx="14" fill="#dcfce7"/><text x="1280" y="335" stroke="none">Data / service</text><text x="1280" y="370" stroke="none">database or external API</text></g><g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M350 320H600M900 320H1150M1150 390H900M600 390H350"/></g><g font-family="Arial" font-size="20" fill="#475569"><text x="430" y="290">Request: method, URL, headers, body</text><text x="390" y="455">Response: status, headers, JSON/error body</text><text x="950" y="290">query / write</text><text x="970" y="455">data / failure</text></g></svg>
