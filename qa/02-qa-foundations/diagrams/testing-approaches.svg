<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
 <title id="title">Testing approaches</title><desc id="desc">Black box, gray box, and white box access levels around an application.</desc>
 <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs>
 <rect width="1500" height="900" fill="#f8fafc"/><text x="60" y="70" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Testing approaches: what information does QA use?</text>
 <g font-family="Arial" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="560" y="230" width="380" height="360" rx="18" fill="#fff"/><text x="750" y="280" text-anchor="middle" font-size="28" font-weight="700" stroke="none">Application</text><rect x="620" y="330" width="260" height="80" rx="10" fill="#dbeafe"/><text x="750" y="378" text-anchor="middle" font-size="22" stroke="none">UI / API behavior</text><rect x="620" y="450" width="260" height="80" rx="10" fill="#ede9fe"/><text x="750" y="498" text-anchor="middle" font-size="22" stroke="none">Code / logic / data</text></g>
 <g font-family="Arial" font-size="23" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="90" y="160" width="310" height="150" rx="14" fill="#dcfce7"/><text x="245" y="210" text-anchor="middle" stroke="none" font-weight="700">Black box</text><text x="245" y="246" text-anchor="middle" stroke="none">Input -> output only</text><text x="245" y="278" text-anchor="middle" stroke="none">Example: login UI</text><rect x="1090" y="160" width="310" height="150" rx="14" fill="#fef3c7"/><text x="1245" y="210" text-anchor="middle" stroke="none" font-weight="700">White box</text><text x="1245" y="246" text-anchor="middle" stroke="none">Code branches, coverage</text><text x="1245" y="278" text-anchor="middle" stroke="none">Example: unit tests</text><rect x="90" y="610" width="310" height="150" rx="14" fill="#cffafe"/><text x="245" y="660" text-anchor="middle" stroke="none" font-weight="700">Gray box</text><text x="245" y="696" text-anchor="middle" stroke="none">UI/API + logs/data clues</text><text x="245" y="728" text-anchor="middle" stroke="none">Example: network trace</text></g>
 <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M400 235H560"/><path d="M1090 235H940"/><path d="M400 685L620 530"/></g>
 <text x="750" y="830" text-anchor="middle" font-family="Arial" font-size="21" fill="#475569">Use the smallest amount of internal knowledge needed to investigate and communicate clearly.</text>
</svg>
