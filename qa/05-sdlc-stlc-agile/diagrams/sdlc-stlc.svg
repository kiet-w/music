<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">SDLC and STLC relationship</title><desc id="desc">Development phases above test lifecycle activities, showing QA involvement early.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="1500" height="900" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">SDLC and STLC: QA starts before execution</text><g font-family="Arial" font-size="20" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2"><text x="70" y="180" text-anchor="start" stroke="none" font-size="25" font-weight="700">SDLC</text><text x="70" y="500" text-anchor="start" stroke="none" font-size="25" font-weight="700">STLC</text><rect x="130" y="130" width="180" height="90" rx="12" fill="#dbeafe"/><text x="220" y="182" stroke="none">Requirement</text><rect x="350" y="130" width="180" height="90" rx="12" fill="#e0f2fe"/><text x="440" y="182" stroke="none">Design</text><rect x="570" y="130" width="180" height="90" rx="12" fill="#ede9fe"/><text x="660" y="182" stroke="none">Development</text><rect x="790" y="130" width="180" height="90" rx="12" fill="#fef3c7"/><text x="880" y="182" stroke="none">Testing</text><rect x="1010" y="130" width="180" height="90" rx="12" fill="#dcfce7"/><text x="1100" y="182" stroke="none">Deploy</text><rect x="1230" y="130" width="180" height="90" rx="12" fill="#fee2e2"/><text x="1320" y="182" stroke="none">Maintain</text><rect x="130" y="450" width="180" height="90" rx="12" fill="#cffafe"/><text x="220" y="502" stroke="none">Analyze</text><rect x="350" y="450" width="180" height="90" rx="12" fill="#bae6fd"/><text x="440" y="502" stroke="none">Plan</text><rect x="570" y="450" width="180" height="90" rx="12" fill="#c4b5fd"/><text x="660" y="502" stroke="none">Design tests</text><rect x="790" y="450" width="180" height="90" rx="12" fill="#fde68a"/><text x="880" y="502" stroke="none">Execute</text><rect x="1010" y="450" width="180" height="90" rx="12" fill="#bbf7d0"/><text x="1100" y="502" stroke="none">Defects / Retest</text><rect x="1230" y="450" width="180" height="90" rx="12" fill="#fecdd3"/><text x="1320" y="502" stroke="none">Closure</text></g><g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M310 175H350M530 175H570M750 175H790M970 175H1010M1190 175H1230"/><path d="M310 495H350M530 495H570M750 495H790M970 495H1010M1190 495H1230"/></g><g stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"><path d="M220 220V450M440 220V450M660 220V450M880 220V450M1100 220V450M1320 220V450"/></g><text x="750" y="700" text-anchor="middle" font-family="Arial" font-size="22" fill="#475569">Dashed links show when QA can prepare and influence quality, not a strict one-to-one mapping.</text></svg>
