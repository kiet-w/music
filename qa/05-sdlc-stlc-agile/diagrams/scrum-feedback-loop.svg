<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Scrum feedback loop</title><desc id="desc">Product backlog feeds sprint planning, daily work and review then retrospective improves the backlog.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="1500" height="760" fill="#f8fafc"/><text x="60" y="66" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Scrum: short feedback cycles</text><g font-family="Arial" font-size="23" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="70" y="260" width="220" height="100" rx="14" fill="#dbeafe"/><text x="180" y="305" stroke="none">Product backlog</text><text x="180" y="337" stroke="none">stories + risks</text><rect x="390" y="260" width="220" height="100" rx="14" fill="#fef3c7"/><text x="500" y="305" stroke="none">Sprint planning</text><text x="500" y="337" stroke="none">test approach</text><rect x="710" y="260" width="220" height="100" rx="14" fill="#ede9fe"/><text x="820" y="305" stroke="none">Sprint work</text><text x="820" y="337" stroke="none">build + test daily</text><rect x="1030" y="260" width="220" height="100" rx="14" fill="#dcfce7"/><text x="1140" y="305" stroke="none">Review</text><text x="1140" y="337" stroke="none">demo + feedback</text><rect x="1030" y="520" width="220" height="90" rx="14" fill="#cffafe"/><text x="1140" y="575" stroke="none">Retrospective</text></g><g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"><path d="M290 310H390M610 310H710M930 310H1030M1140 360V520M1030 565C760 730 260 690 180 360"/></g><text x="820" y="210" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">QA clarifies, tests early, reports evidence, and feeds quality learning into the next sprint.</text></svg>
