<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Page Object Model Architecture</title>
  <desc id="desc">Layered architecture separating test scripts, page objects, and browser automation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Page Object Model (POM) Architecture</text>

  <g font-family="Arial, sans-serif" stroke="#334155" stroke-width="2">
    <!-- Test Scripts Layer -->
    <rect x="80" y="140" width="1340" height="170" rx="16" fill="#dcfce7"/>
    <text x="120" y="185" font-size="24" font-weight="700" stroke="none" fill="#15803d">1. Test Specs Layer (`tests/*.spec.ts`)</text>
    <text x="120" y="225" font-size="18" stroke="none" fill="#475569">Chứa Test Cases ngắn gọn, đọc như ngôn ngữ tự nhiên, KHÔNG chứa hardcoded selector:</text>
    <rect x="120" y="240" width="1260" height="50" rx="8" fill="#ffffff"/>
    <text x="140" y="272" font-size="17" font-family="Courier, monospace" stroke="none" fill="#16a34a">await loginPage.login('user@test.com', 'Pass123!'); await loginPage.expectSuccess();</text>

    <!-- Page Objects Layer -->
    <rect x="80" y="370" width="1340" height="230" rx="16" fill="#ede9fe"/>
    <text x="120" y="415" font-size="24" font-weight="700" stroke="none" fill="#6d28d9">2. Page Objects Layer (`pages/*.page.ts`)</text>
    <text x="120" y="455" font-size="18" stroke="none" fill="#475569">Đóng gói UI Locators &amp; Action Methods của từng trang:</text>
    <rect x="120" y="470" width="1260" height="110" rx="8" fill="#ffffff"/>
    <text x="140" y="505" font-size="16" font-family="Courier, monospace" stroke="none" fill="#6d28d9">readonly emailInput = page.getByRole('textbox', { name: 'Email' });</text>
    <text x="140" y="535" font-size="16" font-family="Courier, monospace" stroke="none" fill="#6d28d9">async login(email, pass) { await this.emailInput.fill(email); await this.submitBtn.click(); }</text>

    <!-- Browser Automation Layer -->
    <rect x="80" y="650" width="1340" height="130" rx="16" fill="#dbeafe"/>
    <text x="120" y="695" font-size="24" font-weight="700" stroke="none" fill="#1e3a8a">3. Playwright Engine &amp; Browsers</text>
    <text x="120" y="735" font-size="18" stroke="none" fill="#475569">Thực thi hành vi trên Chromium / Firefox / WebKit thông qua DevTools Protocol</text>
  </g>

  <!-- Connectors -->
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M750 310V370"/>
    <path d="M750 600V650"/>
  </g>

  <text x="750" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Khi UI thay đổi, bạn chỉ cần sửa Selector duy nhất 1 lần tại Page Object thay vì sửa hàng trăm file Test.</text>
</svg>
