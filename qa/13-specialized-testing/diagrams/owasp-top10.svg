<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">OWASP Top 10 Security Checklist for QA</title>
  <desc id="desc">Security test scenarios focused on IDOR, XSS, and Authentication failures.</desc>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">OWASP Top 10: Security Testing Checklist for QA</text>

  <g font-family="Arial, sans-serif" stroke="#334155" stroke-width="2">
    <!-- A01 Broken Access Control / IDOR -->
    <rect x="70" y="140" width="640" height="280" rx="16" fill="#fee2e2"/>
    <text x="100" y="190" font-size="24" font-weight="700" stroke="none" fill="#b91c1c">A01: Broken Access Control (IDOR Test)</text>
    <text x="100" y="230" font-size="18" stroke="none" fill="#475569">1. Login User A ➔ Gọi GET /api/orders ➔ Có order_id = 100</text>
    <text x="100" y="270" font-size="18" stroke="none" fill="#475569">2. Dùng Token User A ➔ Gọi GET /api/orders/101 (Đơn hàng của User B)</text>
    <text x="100" y="320" font-size="18" font-weight="700" stroke="none" fill="#15803d">✅ Expected: 403 Forbidden</text>
    <text x="100" y="360" font-size="18" font-weight="700" stroke="none" fill="#b91c1c">🚨 BUG IDOR nếu nhận: 200 OK với dữ liệu của User B!</text>

    <!-- A03 Injection / XSS -->
    <rect x="790" y="140" width="640" height="280" rx="16" fill="#fef3c7"/>
    <text x="820" y="190" font-size="24" font-weight="700" stroke="none" fill="#b45309">A03: Injection &amp; XSS (Cross-Site Scripting)</text>
    <text x="820" y="230" font-size="18" stroke="none" fill="#475569">1. Nhập payload `&lt;script&gt;alert(1)&lt;/script&gt;` vào Form Input</text>
    <text x="820" y="270" font-size="18" stroke="none" fill="#475569">2. Thử SQLi string `' OR '1'='1` tại trang Login</text>
    <text x="820" y="320" font-size="18" font-weight="700" stroke="none" fill="#15803d">✅ Expected: Input được Escape HTML an toàn, không nổ alert</text>
    <text x="820" y="360" font-size="18" font-weight="700" stroke="none" fill="#b45309">🚨 BUG nếu script tự động thực thi trong trình duyệt!</text>

    <!-- A07 Authentication Failures -->
    <rect x="70" y="470" width="640" height="280" rx="16" fill="#dbeafe"/>
    <text x="100" y="520" font-size="24" font-weight="700" stroke="none" fill="#1e3a8a">A07: Authentication &amp; Session Failures</text>
    <text x="100" y="560" font-size="18" stroke="none" fill="#475569">• Thử nhập sai Password 5 lần liên tiếp ➔ Rate limit / Lock account</text>
    <text x="100" y="600" font-size="18" stroke="none" fill="#475569">• Token JWT hết hạn ➔ Phải tự động Logout về `/login`</text>
    <text x="100" y="640" font-size="18" stroke="none" fill="#475569">• Cookie Auth phải có flag: `HttpOnly`, `Secure`, `SameSite=Strict`</text>

    <!-- A05 Security Misconfiguration -->
    <rect x="790" y="470" width="640" height="280" rx="16" fill="#ede9fe"/>
    <text x="820" y="520" font-size="24" font-weight="700" stroke="none" fill="#6d28d9">A05: Security Misconfiguration</text>
    <text x="820" y="560" font-size="18" stroke="none" fill="#475569">• API Lỗi 500 KHÔNG được trả về Stack Trace chứa password/db string</text>
    <text x="820" y="600" font-size="18" stroke="none" fill="#475569">• Kiểm tra các Header an toàn: `Content-Security-Policy`, `X-Frame-Options`</text>
    <text x="820" y="640" font-size="18" stroke="none" fill="#475569">• Tắt Swagger UI hoặc Admin Endpoints trên môi trường Production</text>
  </g>

  <text x="750" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">QA cần tích hợp kiểm thử an ninh cơ bản (IDOR, XSS, Session) ngay trong các buổi Manual &amp; API Testing.</text>
</svg>
