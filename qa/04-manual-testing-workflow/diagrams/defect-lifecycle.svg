<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Defect lifecycle</title><desc id="desc">Common bug status flow from New to Closed including rejected and reopened alternatives.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="1500" height="760" fill="#f8fafc"/><text x="60" y="66" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Typical defect lifecycle (status names vary by team)</text><g font-family="Arial" font-size="24" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="70" y="255" width="170" height="80" rx="12" fill="#dbeafe"/><text x="155" y="304" stroke="none">New</text><rect x="335" y="255" width="170" height="80" rx="12" fill="#fef3c7"/><text x="420" y="304" stroke="none">Triaged</text><rect x="600" y="255" width="170" height="80" rx="12" fill="#fee2e2"/><text x="685" y="304" stroke="none">In progress</text><rect x="865" y="255" width="170" height="80" rx="12" fill="#ede9fe"/><text x="950" y="304" stroke="none">Fixed</text><rect x="1130" y="255" width="170" height="80" rx="12" fill="#dcfce7"/><text x="1215" y="304" stroke="none">Retest</text><rect x="1130" y="520" width="170" height="80" rx="12" fill="#bbf7d0"/><text x="1215" y="569" stroke="none">Closed</text><rect x="600" y="520" width="170" height="80" rx="12" fill="#e2e8f0"/><text x="685" y="569" stroke="none">Rejected / Duplicate</text><rect x="865" y="520" width="170" height="80" rx="12" fill="#fecaca"/><text x="950" y="569" stroke="none">Reopened</text></g><g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M240 295H335"/><path d="M505 295H600"/><path d="M770 295H865"/><path d="M1035 295H1130"/><path d="M1215 335V520"/><path d="M1130 560H1035"/><path d="M950 520V335"/><path d="M600 335L710 520"/></g><text x="750" y="695" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">QA verifies the fix against the original expected result; only then can the issue close.</text></svg>
