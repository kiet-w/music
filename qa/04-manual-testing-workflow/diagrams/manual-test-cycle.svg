<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
 <title id="title">Manual testing cycle</title><desc id="desc">A six step loop from requirements to summary and feedback.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs>
 <rect width="1500" height="900" fill="#f8fafc"/><text x="60" y="68" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Manual testing workflow for one feature</text>
 <g font-family="Arial" font-size="23" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="100" y="150" width="270" height="110" rx="14" fill="#dbeafe"/><text x="235" y="194" stroke="none">1. Understand</text><text x="235" y="226" stroke="none">requirement + oracle</text><rect x="480" y="150" width="270" height="110" rx="14" fill="#dcfce7"/><text x="615" y="194" stroke="none">2. Plan risks</text><text x="615" y="226" stroke="none">scope + data + priority</text><rect x="860" y="150" width="270" height="110" rx="14" fill="#fef3c7"/><text x="995" y="194" stroke="none">3. Design tests</text><text x="995" y="226" stroke="none">scenario + test case</text><rect x="1060" y="490" width="270" height="110" rx="14" fill="#fee2e2"/><text x="1195" y="534" stroke="none">4. Execute</text><text x="1195" y="566" stroke="none">actual + evidence</text><rect x="680" y="490" width="270" height="110" rx="14" fill="#ede9fe"/><text x="815" y="534" stroke="none">5. Report defect</text><text x="815" y="566" stroke="none">reproduce + triage</text><rect x="300" y="490" width="270" height="110" rx="14" fill="#cffafe"/><text x="435" y="534" stroke="none">6. Retest</text><text x="435" y="566" stroke="none">regression + summary</text></g>
 <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"><path d="M370 205H480"/><path d="M750 205H860"/><path d="M1130 260C1230 310 1260 400 1210 490"/><path d="M1060 545H950"/><path d="M680 545H570"/><path d="M300 545C110 490 110 320 175 260"/></g>
 <text x="750" y="760" text-anchor="middle" font-family="Arial" font-size="22" fill="#475569">Feedback from defects and production updates the next plan and regression suite.</text>
</svg>
