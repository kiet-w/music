<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">DevTools bug investigation flow</title><desc id="desc">A flow from reproduction through Console and Network evidence to a precise report.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="1500" height="820" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">DevTools: turn an observed failure into useful evidence</text><g font-family="Arial" font-size="22" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="70" y="290" width="210" height="100" rx="14" fill="#dbeafe"/><text x="175" y="335" stroke="none">Reproduce</text><text x="175" y="365" stroke="none">exact steps</text><rect x="390" y="290" width="210" height="100" rx="14" fill="#fef3c7"/><text x="495" y="335" stroke="none">Open DevTools</text><text x="495" y="365" stroke="none">Console + Network</text><rect x="710" y="145" width="240" height="100" rx="14" fill="#fee2e2"/><text x="830" y="190" stroke="none">Console evidence</text><text x="830" y="220" stroke="none">error + timestamp</text><rect x="710" y="445" width="240" height="100" rx="14" fill="#ede9fe"/><text x="830" y="490" stroke="none">Network evidence</text><text x="830" y="520" stroke="none">request + response</text><rect x="1060" y="290" width="280" height="100" rx="14" fill="#dcfce7"/><text x="1200" y="335" stroke="none">Precise bug report</text><text x="1200" y="365" stroke="none">steps + expected + actual</text></g><g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"><path d="M280 340H390M600 340L710 195M600 340L710 495M950 195L1060 320M950 495L1060 365"/></g><text x="750" y="700" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Attach only evidence relevant to reproduction; remove tokens, cookies, and personal data.</text></svg>
