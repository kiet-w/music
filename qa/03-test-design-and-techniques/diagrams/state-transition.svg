<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">State Transition Diagram for Order Lifecycle</title>
  <desc id="desc">States and valid/invalid transitions of an online order.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0 0L0 6L9 3z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">State Transition Testing: Order Lifecycle</text>

  <g font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2">
    <!-- DRAFT -->
    <rect x="80" y="320" width="180" height="90" rx="14" fill="#e2e8f0"/>
    <text x="170" y="360" stroke="none" font-weight="700">DRAFT</text>
    <text x="170" y="388" font-size="16" stroke="none" fill="#475569">Giỏ hàng</text>

    <!-- SUBMITTED -->
    <rect x="360" y="320" width="190" height="90" rx="14" fill="#dbeafe"/>
    <text x="455" y="360" stroke="none" font-weight="700">SUBMITTED</text>
    <text x="455" y="388" font-size="16" stroke="none" fill="#475569">Đã đặt hàng</text>

    <!-- APPROVED -->
    <rect x="660" y="180" width="180" height="90" rx="14" fill="#dcfce7"/>
    <text x="750" y="220" stroke="none" font-weight="700">APPROVED</text>
    <text x="750" y="248" font-size="16" stroke="none" fill="#15803d">Đã duyệt</text>

    <!-- REJECTED -->
    <rect x="660" y="460" width="180" height="90" rx="14" fill="#fee2e2"/>
    <text x="750" y="500" stroke="none" font-weight="700">REJECTED</text>
    <text x="750" y="528" font-size="16" stroke="none" fill="#b91c1c">Bị từ chối</text>

    <!-- SHIPPED -->
    <rect x="960" y="180" width="180" height="90" rx="14" fill="#fef3c7"/>
    <text x="1050" y="220" stroke="none" font-weight="700">SHIPPED</text>
    <text x="1050" y="248" font-size="16" stroke="none" fill="#b45309">Đang giao</text>

    <!-- DELIVERED -->
    <rect x="1240" y="180" width="180" height="90" rx="14" fill="#bbf7d0"/>
    <text x="1330" y="220" stroke="none" font-weight="700">DELIVERED ✅</text>
    <text x="1330" y="248" font-size="16" stroke="none" fill="#16a34a">Hoàn thành</text>

    <!-- CANCELLED -->
    <rect x="360" y="580" width="190" height="90" rx="14" fill="#f1f5f9"/>
    <text x="455" y="620" stroke="none" font-weight="700">CANCELLED</text>
    <text x="455" y="648" font-size="16" stroke="none" fill="#475569">Đã hủy</text>
  </g>

  <!-- Connectors with labels -->
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M260 365H360"/>
    <path d="M550 345L660 245"/>
    <path d="M550 385L660 485"/>
    <path d="M840 225H960"/>
    <path d="M1140 225H1240"/>
    <path d="M455 410V580"/>
  </g>

  <!-- Transition Labels -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#3b82f6">
    <text x="310" y="350" text-anchor="middle">Checkout</text>
    <text x="610" y="275" text-anchor="middle">Approve</text>
    <text x="610" y="455" text-anchor="middle">Reject</text>
    <text x="900" y="210" text-anchor="middle">Ship</text>
    <text x="1190" y="210" text-anchor="middle">Deliver</text>
    <text x="475" y="500" text-anchor="start">Cancel</text>
  </g>

  <text x="750" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Test cả luồng chuyển trạng thái hợp lệ (Positive) lẫn cố tình chuyển bất hợp lệ (Negative - ví dụ DRAFT → SHIPPED).</text>
</svg>
