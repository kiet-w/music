<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
 <title id="title">Risk-based test prioritization</title><desc id="desc">A risk grid maps likelihood and impact to testing priority.</desc>
 <rect width="1500" height="900" fill="#f8fafc"/><text x="60" y="68" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Risk-based testing: test the highest risk first</text>
 <g transform="translate(320 145)" font-family="Arial" fill="#0f172a"><text x="390" y="-25" font-size="25" text-anchor="middle">Impact if it fails</text><text x="-45" y="320" font-size="25" text-anchor="middle" transform="rotate(-90 -45 320)">Likelihood of failure</text><rect width="780" height="610" fill="#fff" stroke="#334155" stroke-width="2"/><path d="M390 0V610M0 305H780" stroke="#334155" stroke-width="2"/>
 <rect x="2" y="2" width="386" height="301" fill="#dcfce7"/><text x="195" y="140" text-anchor="middle" font-size="27">Low priority</text><text x="195" y="174" text-anchor="middle" font-size="20">cosmetic, rare path</text><rect x="392" y="2" width="386" height="301" fill="#fef3c7"/><text x="585" y="140" text-anchor="middle" font-size="27">High priority</text><text x="585" y="174" text-anchor="middle" font-size="20">payment, auth, data</text><rect x="2" y="307" width="386" height="301" fill="#e0f2fe"/><text x="195" y="445" text-anchor="middle" font-size="27">Medium priority</text><text x="195" y="479" text-anchor="middle" font-size="20">frequent small issue</text><rect x="392" y="307" width="386" height="301" fill="#fee2e2"/><text x="585" y="445" text-anchor="middle" font-size="27" font-weight="700">Test first</text><text x="585" y="479" text-anchor="middle" font-size="20">new code + high impact</text><text x="585" y="512" text-anchor="middle" font-size="20">security + data loss</text>
 <text x="195" y="650" text-anchor="middle" font-size="20">Lower</text><text x="585" y="650" text-anchor="middle" font-size="20">Higher</text><text x="-15" y="590" font-size="20" text-anchor="end">Higher</text><text x="-15" y="35" font-size="20" text-anchor="end">Lower</text></g>
 <text x="750" y="845" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Re-evaluate priority when requirements, code changes, users, or production signals change.</text>
</svg>
