<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Equivalence Partitioning and Boundary Value Analysis</title>
  <desc id="desc">Visual partitioning of input data with boundary value testing points.</desc>
  <rect width="1500" height="900" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Equivalence Partitioning (EP) &amp; Boundary Value Analysis (BVA)</text>
  <text x="60" y="110" font-family="Arial, sans-serif" font-size="22" fill="#475569">Ví dụ: Trường "Tuổi" chấp nhận giá trị hợp lệ từ 18 đến 65</text>

  <g font-family="Arial, sans-serif" stroke="#334155" stroke-width="2">
    <!-- Partition 1: Invalid < 18 -->
    <rect x="100" y="200" width="400" height="220" rx="16" fill="#fee2e2"/>
    <text x="300" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#b91c1c" stroke="none">Partition 1: Invalid (&lt; 18)</text>
    <text x="300" y="290" text-anchor="middle" font-size="18" fill="#475569" stroke="none">EP representative: 15</text>
    <text x="300" y="330" text-anchor="middle" font-size="18" fill="#b91c1c" stroke="none">Expected: Error message</text>

    <!-- Partition 2: Valid 18-65 -->
    <rect x="550" y="200" width="400" height="220" rx="16" fill="#dcfce7"/>
    <text x="750" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#15803d" stroke="none">Partition 2: Valid (18 – 65)</text>
    <text x="750" y="290" text-anchor="middle" font-size="18" fill="#475569" stroke="none">EP representative: 30</text>
    <text x="750" y="330" text-anchor="middle" font-size="18" fill="#15803d" stroke="none">Expected: Accept input</text>

    <!-- Partition 3: Invalid > 65 -->
    <rect x="1000" y="200" width="400" height="220" rx="16" fill="#fee2e2"/>
    <text x="1200" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#b91c1c" stroke="none">Partition 3: Invalid (&gt; 65)</text>
    <text x="1200" y="290" text-anchor="middle" font-size="18" fill="#475569" stroke="none">EP representative: 70</text>
    <text x="1200" y="330" text-anchor="middle" font-size="18" fill="#b91c1c" stroke="none">Expected: Error message</text>

    <!-- BVA Timeline Bar -->
    <line x1="100" y1="560" x2="1400" y2="560" stroke="#334155" stroke-width="4"/>

    <!-- Boundary Markers -->
    <!-- 17 -->
    <circle cx="450" cy="560" r="16" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="450" y="620" text-anchor="middle" font-size="20" font-weight="700" stroke="none" fill="#ef4444">17 (min-1)</text>
    <text x="450" y="650" text-anchor="middle" font-size="18" stroke="none" fill="#ef4444">❌ Invalid</text>

    <!-- 18 -->
    <circle cx="550" cy="560" r="18" fill="#bbf7d0" stroke="#22c55e" stroke-width="4"/>
    <text x="550" y="620" text-anchor="middle" font-size="20" font-weight="700" stroke="none" fill="#16a34a">18 (min)</text>
    <text x="550" y="650" text-anchor="middle" font-size="18" stroke="none" fill="#16a34a">✅ Valid</text>

    <!-- 19 -->
    <circle cx="650" cy="560" r="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="650" y="620" text-anchor="middle" font-size="20" font-weight="700" stroke="none" fill="#16a34a">19 (min+1)</text>
    <text x="650" y="650" text-anchor="middle" font-size="18" stroke="none" fill="#16a34a">✅ Valid</text>

    <!-- 64 -->
    <circle cx="850" cy="560" r="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="850" y="620" text-anchor="middle" font-size="20" font-weight="700" stroke="none" fill="#16a34a">64 (max-1)</text>
    <text x="850" y="650" text-anchor="middle" font-size="18" stroke="none" fill="#16a34a">✅ Valid</text>

    <!-- 65 -->
    <circle cx="950" cy="560" r="18" fill="#bbf7d0" stroke="#22c55e" stroke-width="4"/>
    <text x="950" y="620" text-anchor="middle" font-size="20" font-weight="700" stroke="none" fill="#16a34a">65 (max)</text>
    <text x="950" y="650" text-anchor="middle" font-size="18" stroke="none" fill="#16a34a">✅ Valid</text>

    <!-- 66 -->
    <circle cx="1050" cy="560" r="16" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="1050" y="620" text-anchor="middle" font-size="20" font-weight="700" stroke="none" fill="#ef4444">66 (max+1)</text>
    <text x="1050" y="650" text-anchor="middle" font-size="18" stroke="none" fill="#ef4444">❌ Invalid</text>
  </g>

  <text x="750" y="845" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">EP giúp giảm số lượng test case; BVA tập trung phát hiện lỗi tại các điểm ranh giới.</text>
</svg>
