<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc"><title id="title">Add to Cart testing flow</title><desc id="desc">A user test flow shows login, product selection, add to cart, badge verification, cart verification and edge cases.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="1500" height="820" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Add to Cart: test flow and places to explore</text><g font-family="Arial" font-size="22" text-anchor="middle" fill="#0f172a" stroke="#334155" stroke-width="2"><rect x="65" y="280" width="205" height="100" rx="14" fill="#dbeafe"/><text x="167" y="325" stroke="none">Login</text><text x="167" y="355" stroke="none">valid / invalid</text><rect x="355" y="280" width="205" height="100" rx="14" fill="#e0f2fe"/><text x="457" y="325" stroke="none">Products</text><text x="457" y="355" stroke="none">stock / price</text><rect x="645" y="280" width="205" height="100" rx="14" fill="#fef3c7"/><text x="747" y="325" stroke="none">Add item</text><text x="747" y="355" stroke="none">single / multiple</text><rect x="935" y="280" width="205" height="100" rx="14" fill="#ede9fe"/><text x="1037" y="325" stroke="none">Verify badge</text><text x="1037" y="355" stroke="none">count / update</text><rect x="1225" y="280" width="205" height="100" rx="14" fill="#dcfce7"/><text x="1327" y="325" stroke="none">Open cart</text><text x="1327" y="355" stroke="none">item / total</text><rect x="525" y="560" width="450" height="100" rx="14" fill="#fee2e2"/><text x="750" y="605" stroke="none">Explore edge and recovery paths</text><text x="750" y="637" stroke="none">refresh, double click, remove, network, session</text></g><g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#a)"><path d="M270 330H355M560 330H645M850 330H935M1140 330H1225M1327 380C1260 490 1040 585 975 600M525 610C260 580 180 490 167 380"/></g></svg>
