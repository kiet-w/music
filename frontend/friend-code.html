<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Friend Code Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#303632",
                        "error": "#ffb4ab",
                        "primary-container": "#25a475",
                        "secondary-fixed": "#e4e1e6",
                        "primary": "#68dba9",
                        "on-primary-fixed": "#002114",
                        "whisper-border": "rgba(255,255,255,0.1)",
                        "secondary-container": "#47464a",
                        "inverse-primary": "#006c4a",
                        "on-tertiary-fixed": "#410004",
                        "surface-tint": "#68dba9",
                        "inverse-surface": "#dee4de",
                        "surface": "#0f1511",
                        "on-secondary-fixed": "#1b1b1e",
                        "on-surface": "#dee4de",
                        "pure-white": "#FFFFFF",
                        "inverse-on-surface": "#2c322e",
                        "on-background": "#dee4de",
                        "secondary-fixed-dim": "#c8c5ca",
                        "void-surface": "#09090B",
                        "background": "#0f1511",
                        "surface-dim": "#0f1511",
                        "on-surface-variant": "#bccac0",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "surface-container-low": "#171d19",
                        "on-secondary-fixed-variant": "#47464a",
                        "on-tertiary": "#601214",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed": "#ffdad7",
                        "on-tertiary-fixed-variant": "#7f2928",
                        "primary-fixed": "#85f8c4",
                        "surface-variant": "#303632",
                        "on-tertiary-container": "#570b0e",
                        "surface-bright": "#343b37",
                        "on-secondary": "#303033",
                        "surface-container": "#1b211d",
                        "muted-steel": "#71717A",
                        "on-primary-container": "#00311f",
                        "active-tab-surface": "#27272A",
                        "on-primary": "#003825",
                        "outline-variant": "#3d4a42",
                        "outline": "#87948b",
                        "surface-container-lowest": "#0a0f0c",
                        "tertiary": "#ffb3ae",
                        "secondary": "#c8c5ca",
                        "error-container": "#93000a",
                        "surface-container-high": "#252b28",
                        "primary-fixed-dim": "#68dba9",
                        "on-secondary-container": "#b6b4b8",
                        "tertiary-container": "#dd706b",
                        "on-primary-fixed-variant": "#005137",
                        "refined-emerald": "#059669"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "2rem",
                        "gutter": "1rem",
                        "element-gap": "1rem",
                        "section-margin": "1.5rem"
                    },
                    "fontFamily": {
                        "headline-lg": ["Geist", "sans-serif"],
                        "body-md": ["Geist", "sans-serif"],
                        "label-sm": ["Geist", "sans-serif"],
                        "label-md": ["Geist", "sans-serif"],
                        "headline-md": ["Geist", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
        body { font-family: 'Geist', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-void-surface min-h-screen flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="bg-void-surface rounded-3xl border border-whisper-border p-container-padding w-full max-w-md flex flex-col gap-section-margin relative">
<!-- Close Button -->
<button aria-label="Close" class="absolute top-6 right-6 text-muted-steel hover:text-pure-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<!-- Header -->
<div class="flex flex-col items-center text-center gap-2">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-2 border border-whisper-border">
<span class="material-symbols-outlined text-pure-white text-2xl" style="font-variation-settings: 'FILL' 1;">key</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-pure-white">Mã Kết Bạn</h1>
<p class="font-body-md text-body-md text-muted-steel max-w-xs">Chia sẻ mã ngắn gọn để kết bạn nhanh chóng</p>
</div>
<!-- Segmented Control (Tabs) -->
<div class="bg-[#18181B] rounded-full p-1 flex border border-whisper-border">
<button class="flex-1 bg-active-tab-surface text-pure-white font-label-md text-label-md py-2 px-4 rounded-full transition-all">
                Lấy mã của tôi
            </button>
<button class="flex-1 text-muted-steel font-label-md text-label-md py-2 px-4 rounded-full transition-all hover:text-pure-white">
                Nhập mã kết bạn
            </button>
</div>
<!-- Body Content -->
<div class="text-center py-4">
<p class="font-body-md text-body-md text-muted-steel">
                Bấm nút bên dưới để tạo Mã Kết Bạn. Bạn bè chỉ cần nhập mã này để kết bạn ngay lập tức mà không cần gõ link phức tạp!
            </p>
</div>
<!-- Primary CTA -->
<button class="w-full bg-refined-emerald text-pure-white font-label-md text-label-md py-4 rounded-2xl transition-transform active:-translate-y-px mt-2">
            Tạo Mã Kết Bạn Nhanh
        </button>
</div>
</body></html>
