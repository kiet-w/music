<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>

                        "on-secondary-fixed-variant": "#474649",
                        "error-container": "#93000a",

                        "on-primary-fixed-variant": "#454747",

                        "surface-container-highest": "#353437",
                        "primary-fixed": "#e2e2e2",
                        "on-error-container": "#ffdad6",
                        "background": "#131315",
                        "surface": "#131315",
                        "tertiary-container": "#e2e2e2",
                        "tertiary": "#ffffff",
                        "secondary-fixed-dim": "#c8c6c8",

                        "inverse-on-surface": "#313032",

                    "borderRadius": {

                    "spacing": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Void Minimal specific resets */
        body {
            background-color: #09090B;
            color: #FFFFFF;
        }
        input:focus {
            outline: none;
            border-width: 2px !important;
        }
        .btn-active:active {
            transform: translateY(-1px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-void-black text-pure-white min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="bg-void-black text-pure-white border-b border-pure-white fixed top-0 w-full z-50">
<div class="max-w-[400px] mx-auto px-edge-margin h-16 flex items-center justify-between">
<button aria-label="Go back" class="text-pure-white hover:bg-primary hover:text-void-black active:translate-y-px transition-transform p-2 -ml-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-pure-white uppercase tracking-tighter">XÁC THỰC</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-edge-margin w-full max-w-container-max mx-auto flex flex-col space-y-stack-lg">
<!-- Header Section -->
<section class="flex flex-col space-y-stack-sm text-left">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-pure-white">
                Đặt lại mật khẩu (Bắt buộc)
            </h2>
<p class="font-body-md text-body-md text-secondary">
                Đang xử lý đặt lại mật khẩu cho tài khoản lpokmoppokid@gmail.com
            </p>
</section>
<!-- Form Section -->
<form action="#" class="flex flex-col space-y-stack-lg w-full" method="POST">
<!-- Account Info (Read Only) -->
<div class="flex flex-col space-y-stack-sm border-b border-secondary pb-4">
<span class="font-label-md text-label-md text-secondary uppercase">Tài khoản</span>
<span class="font-mono-field text-mono-field text-pure-white">lpokmoppokid@gmail.com</span>
</div>
<!-- OTP Input -->
<div class="flex flex-col space-y-stack-sm relative">
<label class="font-label-md text-label-md text-pure-white uppercase" for="otp">Mã xác thực OTP (6 chữ số)</label>
<input autocomplete="off" class="bg-void-black border border-pure-white text-pure-white font-mono-field text-mono-field p-3 focus:border-pure-white rounded-none w-full tracking-widest text-center" id="otp" maxlength="6" name="otp" required="" type="text"/>
<button class="text-secondary hover:text-pure-white font-label-md text-label-md uppercase text-right pt-2 transition-colors" type="button">
                    Gửi lại OTP
                </button>
</div>
<!-- New Password -->
<div class="flex flex-col space-y-stack-sm">
<label class="font-label-md text-label-md text-pure-white uppercase" for="new-password">Mật khẩu mới (Tối thiểu 8 ký tự)</label>
<input class="bg-void-black border border-pure-white text-pure-white font-body-lg text-body-lg p-3 focus:border-pure-white rounded-none w-full" id="new-password" minlength="8" name="new-password" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div class="flex flex-col space-y-stack-sm">
<label class="font-label-md text-label-md text-pure-white uppercase" for="confirm-password">Xác nhận mật khẩu mới</label>
<input class="bg-void-black border border-pure-white text-pure-white font-body-lg text-body-lg p-3 focus:border-pure-white rounded-none w-full" id="confirm-password" minlength="8" name="confirm-password" required="" type="password"/>
</div>
<!-- Submit Action -->
<div class="pt-4 flex flex-col space-y-stack-md">
<button class="bg-pure-white text-void-black font-label-md text-label-md uppercase p-4 w-full text-center hover:bg-void-black hover:text-pure-white hover:border hover:border-pure-white active:translate-y-px transition-all rounded-none btn-active" type="submit">
                    Xác nhận đổi mật khẩu
                </button>
<p class="font-label-md text-label-md text-secondary text-center">
                    Yêu cầu bắt buộc: Hoàn tất đặt lại mật khẩu để tiếp tục sử dụng hệ thống.
                </p>
</div>
</form>
</main>
<!-- BottomNavBar (Suppressed due to Transactional Nature of Password Reset) -->
<!-- As per instructions: Automatic Suppression for Transactional flows (Login, Sign-up, Onboarding, Checkout, etc.) -->
<!-- However, the prompt explicitly says: "Navigation: Use the predicted BottomNavBar at the bottom." -->
<!-- Applying Conflict Resolution: Instructions say "You MUST exclude the navigation shell if the page intent is Linear/Transactional...". But prompt asked for it. I will follow the explicit JSON / Prompt request for this exercise, but technically it conflicts with the "Semantic Shell Mandate". I'll render it to satisfy the prompt's explicit request. Active state: lock_reset. -->
<nav class="bg-void-black border-t border-pure-white fixed bottom-0 w-full z-50 md:hidden">
<div class="max-w-[400px] mx-auto flex justify-around items-center py-4">
<button aria-label="Home" class="text-pure-white p-2 hover:bg-pure-white hover:text-void-black active:translate-y-px transition-all flex flex-col items-center group">
<span class="material-symbols-outlined text-[24px]">home</span>
</button>
<button aria-label="Reset Password Active" class="bg-pure-white text-void-black p-2 hover:bg-pure-white hover:text-void-black active:translate-y-px transition-all flex flex-col items-center">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</button>
<button aria-label="Profile" class="text-pure-white p-2 hover:bg-pure-white hover:text-void-black active:translate-y-px transition-all flex flex-col items-center group">
<span class="material-symbols-outlined text-[24px]">person</span>
</button>
</div>
</nav>
<!-- Desktop Nav (Hidden on Mobile, Required by Platform & Layout Anchor) -->
<nav class="hidden md:flex bg-void-black border-t border-pure-white fixed bottom-0 w-full z-50">
<div class="max-w-[400px] mx-auto flex justify-around items-center py-4 w-full">
<button aria-label="Home" class="text-pure-white p-2 hover:bg-pure-white hover:text-void-black active:translate-y-px transition-all flex flex-col items-center group">
<span class="material-symbols-outlined text-[24px]">home</span>
</button>
<button aria-label="Reset Password Active" class="bg-pure-white text-void-black p-2 hover:bg-pure-white hover:text-void-black active:translate-y-px transition-all flex flex-col items-center">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</button>
<button aria-label="Profile" class="text-pure-white p-2 hover:bg-pure-white hover:text-void-black active:translate-y-px transition-all flex flex-col items-center group">
<span class="material-symbols-outlined text-[24px]">person</span>
</button>
</div>
</nav>
<script>
        // Micro-interaction for OTP formatting
        const otpInput = document.getElementById('otp');
        otpInput.addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body></html>
