<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Auth Module Architecture</title>
  <desc id="desc">NestJS AuthModule internal components and service dependencies using High-Fidelity Enterprise Style.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; }
      .mod { fill: #fff; stroke: #334155; stroke-width: 2; rx: 18; }
      .ctrl { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 12; }
      .svc { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .repo { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 12; }
      .infra { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; rx: 12; }
      .txt { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#a); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#a); stroke-dasharray: 6 6; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" width="1500" height="900"/>
  <text class="title" x="60" y="58">Auth Module: Architecture Diagram</text>
  <text class="small" x="62" y="88">Internal structure of AuthModule, showing controllers, core services, data access, and infrastructure providers.</text>
  
  <rect class="mod" x="60" y="135" width="1380" height="690"/>
  <text class="txt" x="90" y="170">AuthModule Boundary</text>

  <!-- Core Component Stack -->
  <rect class="ctrl" x="120" y="220" width="220" height="60"/><text class="txt" x="165" y="255">AuthController</text>
  <rect class="svc" x="120" y="320" width="220" height="60"/><text class="txt" x="175" y="355">AuthService</text>
  <rect class="repo" x="120" y="420" width="220" height="60"/><text class="txt" x="165" y="455">UserRepository</text>

  <!-- Guards & Decorators -->
  <rect class="infra" x="420" y="220" width="220" height="60"/><text class="txt" x="465" y="255">JwtAuthGuard</text>
  <rect class="infra" x="420" y="320" width="220" height="60"/><text class="txt" x="450" y="355">@CurrentUser()</text>

  <!-- Security & Auth Providers -->
  <rect class="infra" x="750" y="220" width="240" height="60"/><text class="txt" x="825" y="255">JwtService</text>
  <text class="small" x="800" y="300">(HS256 Tokenization)</text>

  <rect class="svc" x="750" y="320" width="240" height="60"/><text class="txt" x="815" y="355">Bcrypt.js</text>
  <text class="small" x="785" y="400">(Salt 12 Password Hashing)</text>

  <rect class="infra" x="750" y="420" width="240" height="60"/><text class="txt" x="785" y="455">Google OAuth SDK</text>
  <text class="small" x="795" y="500">(Google-Auth-Library)</text>

  <!-- Data Infrastructure -->
  <rect class="infra" x="1120" y="220" width="220" height="60"/><text class="txt" x="1185" y="255">Prisma</text>
  <rect class="infra" x="1120" y="320" width="220" height="60"/><text class="txt" x="1175" y="355">PostgreSQL</text>

  <!-- Cross-Cutting -->
  <rect class="svc" x="420" y="580" width="220" height="60"/><text class="txt" x="480" y="615">PinoLogger</text>
  <rect class="svc" x="750" y="580" width="240" height="60"/><text class="txt" x="810" y="615">ConfigService</text>

  <!-- Connections -->
  <!-- Main vertical flow -->
  <path class="arrow" d="M230 280 L230 320"/>
  <path class="arrow" d="M230 380 L230 420"/>

  <!-- Service uses Infra -->
  <path class="arrow" d="M340 350 L750 350"/>
  <path class="arrow" d="M340 350 C500 350 700 260 750 250"/>
  <path class="arrow" d="M340 350 C500 350 700 440 750 450"/>

  <!-- Repository uses Prisma -->
  <path class="arrow" d="M340 450 C700 450 1100 270 1120 250"/>
  <path class="arrow" d="M1230 280 L1230 320"/>

  <!-- Guard uses JWT -->
  <path class="dash" d="M640 250 L750 250"/>

  <!-- Config is used everywhere -->
  <path class="dash" d="M870 580 L870 500"/>
  <path class="dash" d="M870 580 C870 500 300 500 300 380"/>

</svg>
