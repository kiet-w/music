<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">JwtAuthGuard Lifecycle</title>
  <desc id="desc">Decision flow of the JwtAuthGuard, from token extraction to controller authorization.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; }
      .box { fill: #fff; stroke: #334155; stroke-width: 2; rx: 18; }
      .pending { fill: #fef3c7; stroke: #d97706; }
      .work { fill: #e0f2fe; stroke: #0284c7; }
      .ready { fill: #dcfce7; stroke: #16a34a; }
      .fail { fill: #fee2e2; stroke: #dc2626; }
      .txt { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 15px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#a); stroke-dasharray: 7 7; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" width="1500" height="760"/>
  <text class="title" x="60" y="58">Guard: JwtAuthGuard Lifecycle</text>
  <text class="small" x="62" y="88">Request processing path through NestJS Guard, ensuring identity verification before Controller execution.</text>

  <!-- State 1: Incoming -->
  <rect class="box work" x="60" y="210" width="190" height="90"/>
  <text class="txt" x="90" y="244">Request Start</text>
  <text class="small" x="80" y="272">Check Authorization header</text>

  <!-- State 2: Extraction -->
  <rect class="box work" x="310" y="210" width="210" height="90"/>
  <text class="txt" x="345" y="244">Token Extract</text>
  <text class="small" x="330" y="272">Bearer &lt;token&gt; check</text>

  <!-- State 3: Verification -->
  <rect class="box work" x="590" y="210" width="200" height="90"/>
  <text class="txt" x="635" y="244">JWT Verify</text>
  <text class="small" x="610" y="272">jwtService.verifyAsync()</text>

  <!-- State 4: Decision Branches -->
  <!-- Success -->
  <rect class="box ready" x="860" y="120" width="220" height="90"/>
  <text class="txt" x="910" y="154">Context Bind</text>
  <text class="small" x="880" y="182">request['user'] = payload</text>

  <rect class="box ready" x="1160" y="120" width="220" height="90"/>
  <text class="txt" x="1200" y="154">Authorized</text>
  <text class="small" x="1180" y="182">Continue to Controller</text>

  <!-- Failure -->
  <rect class="box fail" x="860" y="310" width="220" height="90"/>
  <text class="txt" x="910" y="344">Token Invalid</text>
  <text class="small" x="880" y="372">Expired or bad signature</text>

  <rect class="box fail" x="1160" y="310" width="220" height="90"/>
  <text class="txt" x="1195" y="344">401 Unauthorized</text>
  <text class="small" x="1185" y="372">Response thrown to client</text>

  <!-- Flow Paths -->
  <path class="arrow" d="M250 255 L310 255"/>
  <path class="arrow" d="M520 255 L590 255"/>
  
  <!-- Success Path -->
  <path class="arrow" d="M790 245 C830 220 840 180 860 165"/>
  <path class="arrow" d="M1080 165 L1160 165"/>

  <!-- Failure Path -->
  <path class="arrow" d="M790 265 C830 290 840 330 860 355"/>
  <path class="arrow" d="M1080 355 L1160 355"/>

  <!-- Missing Header Path -->
  <path class="dash" d="M155 300 C155 450 820 450 860 380"/>
  <text class="small" x="400" y="440">Missing Header → Early 401 Exit</text>

  <!-- Summary Note -->
  <text class="small" x="60" y="550">Technical Implementation: Implements CanActivate. Verification uses server-side JWT_SECRET. Context switching is protocol-agnostic (Http/Ws).</text>
</svg>
