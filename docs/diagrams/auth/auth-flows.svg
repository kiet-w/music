<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Auth Module Request Flows</title>
  <desc id="desc">Detailed SVG diagram for the Auth module showing registration, login, and identity verification lifecycles.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 22; }
      .box { fill: #fff; stroke: #334155; stroke-width: 2; rx: 16; }
      .controller { fill: #e0f2fe; stroke: #0284c7; }
      .dep { fill: #dcfce7; stroke: #16a34a; }
      .infra { fill: #f3e8ff; stroke: #9333ea; }
      .warn { fill: #fff7ed; stroke: #f97316; }
      .deny { fill: #fee2e2; stroke: #dc2626; }
      .txt { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Arial, sans-serif; fill: #475569; }
      .mono { font: 700 14px "Courier New", monospace; fill: #0f172a; }
      .path { font: 400 14px "Courier New", monospace; fill: #0f172a; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .label { font: 400 13px Arial, sans-serif; fill: #475569; }
      .note { font: 400 15px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="920" />
  <text class="title" x="60" y="60">Auth Module: Request Lifecycle</text>
  <text class="subtitle" x="62" y="90">Full technical flows for identity management: handles Registration, Login (Local/Google), and JWT Session validation.</text>

  <!-- Left Panel: Request & DTOs -->
  <rect class="panel" x="50" y="135" width="340" height="620" />
  <text class="txt" x="80" y="175">Request &amp; Validation</text>
  
  <rect class="box warn" x="70" y="210" width="300" height="130" />
  <text class="txt" x="145" y="240">RegisterDto</text>
  <text class="mono" x="90" y="270">email: @IsEmail</text>
  <text class="mono" x="90" y="295">password: @MinLength(8)</text>
  <text class="small" x="90" y="320">Normalized: trim().toLowerCase()</text>

  <rect class="box warn" x="70" y="360" width="300" height="130" />
  <text class="txt" x="145" y="390">GoogleLoginDto</text>
  <text class="mono" x="90" y="420">idToken: string</text>
  <text class="small" x="90" y="445">Verified Server-side via SDK</text>
  <text class="small" x="90" y="465">to prevent Token Forgery.</text>

  <rect class="box infra" x="70" y="510" width="300" height="110" />
  <text class="txt" x="145" y="540">JwtAuthGuard</text>
  <text class="small" x="90" y="570">Extraction: Bearer &lt;token&gt;</text>
  <text class="small" x="90" y="590">Decision: 401 vs request.user</text>

  <!-- Middle Panel: Backend Services -->
  <rect class="panel" x="420" y="135" width="600" height="620" />
  <text class="txt" x="450" y="175">NestJS Application Layer</text>

  <rect class="box controller" x="440" y="210" width="560" height="160" />
  <text class="txt" x="650" y="245">AuthController</text>
  <line x1="460" y1="265" x2="980" y2="265" stroke="#94a3b8" stroke-width="1.5" />
  <text class="mono" x="460" y="290">POST /register → register(@Body() dto)</text>
  <text class="mono" x="460" y="315">POST /login    → login(@Body() dto)</text>
  <text class="mono" x="460" y="340">GET  /me       → me(@CurrentUser() user)</text>

  <rect class="box dep" x="440" y="390" width="560" height="340" />
  <text class="txt" x="660" y="425">AuthService</text>
  <line x1="460" y1="445" x2="980" y2="445" stroke="#94a3b8" stroke-width="1.5" />
  
  <text class="mono" x="460" y="475">register() Logic:</text>
  <text class="small" x="480" y="495">Check unique → Bcrypt.hash(12) → create() → sign()</text>
  
  <text class="mono" x="460" y="530">login() Logic:</text>
  <text class="small" x="480" y="550">Find user → Bcrypt.compare() → sign()</text>

  <text class="mono" x="460" y="585">googleLogin() Logic:</text>
  <text class="small" x="480" y="605">google-auth-library verify → findByGoogleId → upsert()</text>

  <rect class="box infra" x="780" y="640" width="200" height="70" />
  <text class="txt" x="830" y="675">JwtService</text>
  <text class="small" x="795" y="695">Sign/Verify HS256</text>

  <!-- Right Panel: Data Layer -->
  <rect class="panel" x="1050" y="135" width="400" height="620" />
  <text class="txt" x="1080" y="175">Infrastructure Layer</text>

  <rect class="box dep" x="1070" y="210" width="360" height="150" />
  <text class="txt" x="1170" y="245">UserRepository</text>
  <text class="small" x="1090" y="270">Extends BaseRepository&lt;User&gt;</text>
  <line x1="1090" y1="285" x2="1410" y2="285" stroke="#94a3b8" stroke-width="1.5" />
  <text class="mono" x="1090" y="315">findByEmail() / findByGoogleId()</text>
  <text class="mono" x="1090" y="340">create() / update()</text>

  <rect class="box infra" x="1070" y="380" width="360" height="120" />
  <text class="txt" x="1195" y="415">PostgreSQL</text>
  <text class="small" x="1090" y="445">Table: User</text>
  <text class="small" x="1090" y="465">Indexes: email (UNIQ), googleId (UNIQ)</text>
  <text class="small" x="1090" y="485">Stores: id, email, passwordHash, name, googleId</text>

  <rect class="box infra" x="1070" y="520" width="360" height="120" />
  <text class="txt" x="1170" y="555">External: Google Auth</text>
  <text class="small" x="1090" y="585">Uses: google-auth-library</text>
  <text class="small" x="1090" y="605">Process: Public key verification</text>
  <text class="small" x="1090" y="625">Audience check against CLIENT_ID</text>

  <!-- Connections -->
  <path class="arrow" d="M390 285 L440 285" />
  <text class="label" x="400" y="275">Request</text>

  <path class="arrow" d="M720 370 L720 390" />
  <text class="label" x="730" y="385">Exec</text>

  <path class="arrow" d="M1000 475 L1060 475" />
  <text class="label" x="1010" y="465">Query</text>

  <path class="dash" d="M1000 580 L1060 580" />
  <text class="label" x="1010" y="570">OAuth</text>

  <path class="dash" d="M440 340 L390 340" />
  <text class="label" x="400" y="330">Response</text>

  <!-- Footer Note -->
  <rect class="panel" x="50" y="785" width="1400" height="90" />
  <text class="note" x="80" y="822">Module Security Decision: Password hashing uses Bcrypt with salt 12 (standard 250ms per hash). Local login is disabled for Google-only accounts (missing passwordHash).</text>
  <text class="note" x="80" y="850">Strategy: Stateless JWT. Guard attaches payload to request object. @CurrentUser decorator used for surgical extraction in Controller.</text>
</svg>
