# prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Caddy metrics (Caddy exposes /metrics on :2019 if admin API is enabled)
  # Uncomment if you add `admin: localhost:2019` to Caddyfile
  # - job_name: 'caddy'
  #   static_configs:
  #     - targets: ['caddy:2019']

  # If backend exposes a /metrics endpoint (e.g. via prom-client):
  # - job_name: 'backend'
  #   static_configs:
  #     - targets: ['backend:3000']
  #   metrics_path: /metrics
